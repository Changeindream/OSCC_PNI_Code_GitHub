[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscc-pni"
version = "0.1.0"
description = "Research pipeline for ROI-guided CECT prediction of perineural invasion in OSCC"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24,<2.1",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "timm==1.0.15",
  "tqdm>=4.66",
]

[project.optional-dependencies]
radiomics = [
  "SimpleITK>=2.3",
  "pyradiomics==3.0.1",
]
medical-images = [
  "SimpleITK>=2.3",
  "nibabel>=5.2",
]
baselines = [
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "scikit-optimize>=0.10",
  "joblib>=1.3",
]
xai = [
  "captum>=0.7",
  "grad-cam==1.5.5",
  "opencv-python-headless==4.11.0.86",
  "umap-learn>=0.5.5",
]
app = [
  "gradio==5.49.1",
  "grad-cam==1.5.5",
  "opencv-python-headless==4.11.0.86",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
oscc-pni = "oscc_pni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oscc_pni = ["paper.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "src/oscc_pni/models/legacy_swin.py",
  "demo/model_defs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
